[package]
name = "server"
version = "1.0.0"
edition = "2024"

[dependencies]
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.28"
futures-util = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "bigdecimal", "chrono"] }
dashmap = "6"
chrono = "0.4"
rand = "0.9"
uuid = { version = "1.0", features = ["v4"] }
bcrypt = "0.17.1"
bigdecimal = { version = "0.4.10", features = ["serde"] }
